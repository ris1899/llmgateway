apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-a
  namespace: llmgateway
spec:
  replicas: 1
  selector: { matchLabels: { app: mock-a } }
  template:
    metadata: { labels: { app: mock-a } }
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: mock-a
          image: llmgateway-mock:latest
          imagePullPolicy: IfNotPresent
          args: ["-addr", ":9001", "-name", "mock-a"]
          ports: [{ containerPort: 9001 }]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 250m, memory: 64Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: 9001 }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 9001 }
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: mock-a
  namespace: llmgateway
spec:
  selector: { app: mock-a }
  ports: [{ port: 9001, targetPort: 9001 }]
---
