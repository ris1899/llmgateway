apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-a
  namespace: llmgateway
spec:
  replicas: 1
  selector: { matchLabels: { app: mock-a } }
  template:
    metadata: { labels: { app: mock-a } }
    spec:
      containers:
        - name: mock-a
          image: llmgateway-mock:latest
          imagePullPolicy: IfNotPresent
          args: ["-addr", ":9001", "-name", "mock-a"]
          ports: [{ containerPort: 9001 }]
---
apiVersion: v1
kind: Service
metadata:
  name: mock-a
  namespace: llmgateway
spec:
  selector: { app: mock-a }
  ports: [{ port: 9001, targetPort: 9001 }]
---
