# mirrors config.compose-noauth.yaml, pointed at in-cluster service names;
# auth/Kafka left off so this manifest set stays self-contained (redis.yaml only)
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: llmgateway
data:
  config.yaml: |
    server:
      addr: ":8080"
      metrics_addr: ":8081"

    redis:
      addr: redis:6379

    cache:
      enabled: true
      ttl: 1h
      max_temperature: 0.3

    router:
      breaker:
        consecutive_failures: 5
        error_rate: 0.5
        min_requests: 20
        cooldown: 2s
        half_open_successes: 3
      retry_budget:
        ratio: 0.2
        min_per_sec: 10
      stats_window: 10s

    providers:
      mock-a:
        type: openai
        base_url: http://mock-a:9001/v1
        timeout: 2s
      mock-b:
        type: openai
        base_url: http://mock-b:9002/v1
        timeout: 2s

    models:
      mock-chat:
        strategy: priority
        deployments:
          - provider: mock-a
            model: mock-small
            input_price_per_m: 0.15
            output_price_per_m: 0.60
            priority: 0
          - provider: mock-b
            model: mock-small
            input_price_per_m: 0.10
            output_price_per_m: 0.40
            priority: 1
